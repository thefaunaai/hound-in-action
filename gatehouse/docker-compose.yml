services:
  gatehouse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatehouse
    ports:
      - "${HOST_PORT:-0}:3000"
    environment:
      - PORT=3000
      - SES_REGION=${SES_REGION:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - ALLOWED_EMAIL=${ALLOWED_EMAIL:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
